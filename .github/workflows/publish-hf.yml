name: Publish to Hugging Face Hub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to publish (all, qwen3guard, laya, granite, liquid-d1, pplx-decider, mica-v0.5)'
        required: true
        default: 'all'

jobs:
  publish-hf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [qwen3guard, laya, granite, liquid-d1, pplx-decider, mica-v0.5]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade huggingface_hub

      - name: Publish Model & Modelfile to Hugging Face
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.model == 'all' || github.event.inputs.model == matrix.model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/publish_to_hf.py --model ${{ matrix.model }}
